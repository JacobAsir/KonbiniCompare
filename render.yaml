services:
  # --- Backend: Node.js Web Service ---
  - type: web
    name: konbinicompare-backend
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm --filter "...@workspace/api-server" build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false # Set in Render Dashboard
      - key: NODE_VERSION
        value: 20

  # --- Frontend: Static Site ---
  - type: web
    name: konbinicompare-frontend
    runtime: static
    buildCommand: "npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm --filter \"...@workspace/konbini-compare\" build"
    staticPublishPath: ./artifacts/konbini-compare/dist/public
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://konbinicompare-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
